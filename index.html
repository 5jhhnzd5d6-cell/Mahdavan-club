<style>:root{--bg:#0a0a0a;--panel:#141414;--raised:#1d1d1d;--line:#2b2b2b;--text:#ededed;--dim:#8d8d8d;--acc:#b08158;--acc2:#d1a477;--accd:#8a6340;--onacc:#150d06;--ok:#7fd6a0;--bad:#e27d7d;--warn:#f0c070;--glow:#c9895a;--tint:rgba(176,129,88,.16)}
[data-theme=light]{--bg:#ececec;--panel:#ffffff;--raised:#f3f1ee;--line:#e1ded9;--text:#141414;--dim:#7d7d7d;--tint:rgba(176,129,88,.18);--ok:#2f9b5f;--bad:#c94a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Vazirmatn","Geeza Pro","SF Arabic",Tahoma,system-ui,sans-serif;font-size:15px}
body{min-height:100dvh;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{background:#0a0a0a;color:#fff;border-radius:0 0 30px 30px;padding:calc(10px + env(safe-area-inset-top)) 20px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header img{height:30px;display:block}#hdate{font-size:13px;color:#b7b7b7}
#tbadge{display:none;background:var(--acc);color:var(--onacc);border:0;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;margin:0 0 12px;animation:fu .3s both}
h2{font-size:15px;margin:0 0 10px}.dim{color:var(--dim);font-size:12px}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.grow{flex:1}.wrapf{flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:99px;padding:10px 16px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4}.pri{background:linear-gradient(145deg,var(--acc2),var(--acc));color:var(--onacc);font-weight:700;border-color:transparent}.dng{color:var(--bad);border-color:rgba(226,125,125,.35)}.sm{padding:6px 11px;font-size:12px}
.in{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:10px 12px;font-size:16px;outline:none}.in:focus{border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--dim);margin:9px 0 4px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--dim)}.chip.h{border-color:rgba(226,125,125,.5);color:var(--bad)}.chip.a{border-color:var(--acc);color:var(--acc2)}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;color:var(--dim);border-radius:99px;padding:8px 2px;font-size:12.5px;white-space:nowrap}.seg button.on{background:var(--acc);color:var(--onacc);font-weight:700}
.ok{color:var(--ok);font-size:13px;margin:6px 0}.err{color:var(--bad);font-size:13px;margin:6px 0}.warn{color:var(--warn);font-size:13px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
/* nav pill */
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;height:66px;border-radius:33px;background:#0b0b0b;border:1px solid #262626;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-items:center;padding:6px;box-shadow:0 12px 34px rgba(0,0,0,.5);z-index:30}
nav button{background:none;border:0;color:#8d8d8d;height:100%;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--acc);color:var(--onacc);font-weight:700}
/* assistant home */
#assist{max-width:560px;margin:0 auto;padding:0 14px}
.stage{position:relative;height:262px;display:grid;place-items:center}
.av2{position:relative;width:176px;height:176px}
.av2 img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--line);position:relative;z-index:2;background:#222;display:block;transition:border-color .3s,box-shadow .3s}
.av2 .halo{position:absolute;inset:-52px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 62%);opacity:.1;filter:blur(8px);transition:opacity .4s}
.av2 .ring{position:absolute;inset:-8px;border-radius:50%;border:1.5px solid var(--glow);opacity:0;z-index:1}
.av2.idle img{animation:br 4.5s ease-in-out infinite}
.av2.listening .halo{opacity:.6;animation:hp 1.6s ease-in-out infinite}.av2.listening .ring{animation:rg 1.8s ease-out infinite}.av2.listening .r2{animation-delay:.9s}
.av2.listening img{border-color:var(--glow);box-shadow:0 0 34px var(--glow)}
.av2.processing .r1{opacity:1;border-color:transparent;border-top-color:var(--acc2);border-width:3px;animation:sp 1s linear infinite}
.av2.speaking .halo{opacity:.38;animation:hp 1s ease-in-out infinite}.av2.speaking img{border-color:var(--acc)}
.av2.success img{border-color:var(--ok);box-shadow:0 0 26px var(--ok)}.av2.error img{border-color:var(--bad);box-shadow:0 0 26px var(--bad)}
.wave{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);display:none;gap:4px;height:22px;align-items:flex-end;z-index:3}
.av2.speaking .wave,.av2.listening .wave{display:flex}
.wave i{width:4px;height:100%;background:var(--glow);border-radius:3px;animation:wv .9s ease-in-out infinite;transform-origin:bottom}.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
.say{text-align:center;margin-top:-4px}.say h1{font-size:21px;margin:0}.say p{margin:5px 0 0;color:var(--dim);font-size:13px}
.accent{background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
#msgs{max-height:128px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:12px 0 4px;padding:0 2px}
.m{white-space:pre-line;max-width:90%;padding:8px 12px;border-radius:16px;font-size:14px;border:1px solid var(--line);background:var(--panel)}.m.u{align-self:flex-start;background:var(--raised);border-color:transparent}.m.ok{background:rgba(127,214,160,.12);color:var(--ok);border-color:transparent}.m.er{background:rgba(226,125,125,.12);color:var(--bad);border-color:transparent}
.microw{display:flex;justify-content:center;align-items:center;gap:22px;margin:10px 0}
.mic{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;border:0;background:linear-gradient(145deg,var(--acc2),var(--acc));color:var(--onacc);box-shadow:0 10px 28px rgba(176,129,88,.38);transition:transform .15s}.mic svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.mic:active{transform:scale(.94)}
.mic.live{animation:mp 1.3s ease-out infinite}
.sidebtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:19px}
#ptxt{margin:6px 0 12px}
.big{font-size:38px;font-weight:700;line-height:1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats3>div{background:var(--raised);border-radius:16px;padding:10px 4px}.stats3 b{font-size:21px;display:block}.stats3 span{font-size:11px;color:var(--dim)}
/* tables (excel-like) */
.xlw{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
table.xl{width:100%;border-collapse:collapse;font-size:13px}
.xl th,.xl td{border:1px solid var(--line);padding:3px 6px;height:36px;text-align:right;vertical-align:middle}
.xl th{background:var(--raised);font-size:11px;color:var(--dim);font-weight:600;height:36px;position:sticky;top:0}
.xl td.tm{width:52px;text-align:center;color:var(--dim);background:var(--raised);font-size:12px;font-variant-numeric:tabular-nums}
.xl tr.empty td.free{color:var(--dim);cursor:pointer;font-size:12px;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(128,128,128,.05) 8px 16px)}.xl .fr{display:flex;justify-content:space-between;align-items:center;min-height:30px}.xl tr.empty td.free b{color:var(--acc);font-size:18px;font-weight:400}
.xl tr.empty.past{opacity:.45}
.xl td.nm{background:var(--tint);cursor:pointer}.xl td.nm b{display:block;font-size:13px}.xl td.nm i{font-style:normal;font-size:11px;color:var(--dim)}
.xl td.sv{font-size:12px}.xl td.pr{font-size:12px;white-space:nowrap}.xl td.ac{width:104px;text-align:center;white-space:nowrap}
.xl tr.st-completed td.nm{background:rgba(127,214,160,.14)}
.xl td.ac button{border:1px solid var(--line);background:var(--raised);border-radius:50%;width:30px;height:30px;font-size:13px;margin:1px}
table.wk{min-width:0;table-layout:fixed}.wk th,.wk td{padding:2px}.wk td.tm,.wk th.tm{width:42px;font-size:10px}.wk td.fillc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wk td.fc{height:32px;cursor:pointer;padding:0}.wk td.off{background:rgba(226,125,125,.06)}.wk td.fillc{background:var(--tint);font-size:10.5px;line-height:1.25;padding:3px 4px;cursor:pointer;overflow:hidden;border-right:3px solid var(--acc)}.wk td.fillc.st-completed{border-right-color:var(--ok)}.wk td.tm,.wk th.tm{position:sticky;right:0;z-index:2}
.wk th.today{color:var(--acc2)}.wk th b{display:block;font-size:14px;color:var(--text)}.wk th.hd b{color:var(--bad)}
.foot{display:flex;justify-content:space-between;padding:10px 4px;font-size:13px;color:var(--dim)}
/* month */
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{text-align:center;font-size:11px;color:var(--dim)}
.cell{min-height:62px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:4px;color:inherit;text-align:right;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell.t{border-color:var(--acc)}.cell.sel{background:var(--raised)}.cell.o{opacity:.3}.cell b{font-size:13px}.cell.hol b{color:var(--bad)}.cell i{font-style:normal;font-size:9px;color:var(--bad);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell u{text-decoration:none;font-size:9px;background:var(--tint);border-radius:4px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap{border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}.ap.x{opacity:.5}.ap .t{font-weight:700}
/* money & charts */
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sum3>div{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 8px;text-align:center}.sum3 b{display:block;font-size:15px;margin-top:3px}.sum3 .in-{color:var(--ok)}.sum3 .ex-{color:var(--bad)}
.led{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.led:last-child{border:0}.led .am{font-weight:700;white-space:nowrap}.led .am.i{color:var(--ok)}.led .am.e{color:var(--bad)}
svg.chart{width:100%;height:auto;display:block;direction:ltr}.chart .bar-a{fill:var(--acc)}.chart .bar-b{fill:var(--bad)}.chart text{fill:var(--dim);font-size:9px}.chart line{stroke:var(--line)}
.hbar{height:8px;border-radius:6px;background:var(--raised);overflow:hidden;margin-top:4px}.hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accd),var(--acc2));border-radius:6px}
/* tasks & timer */
.ti{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ti:last-child{border:0}.ti input{width:22px;height:22px;accent-color:var(--acc)}.ti.d span{text-decoration:line-through;color:var(--dim)}.ti span{flex:1}
.prog{height:8px;background:var(--raised);border-radius:6px;overflow:hidden;margin:8px 0 12px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accd),var(--acc2))}
.tdisp{font-size:64px;font-weight:700;text-align:center;letter-spacing:1px;font-variant-numeric:tabular-nums;direction:ltr;margin:6px 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal>.card{width:100%;max-width:520px;max-height:92dvh;overflow:auto;margin:0;border-radius:26px 26px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#off{background:#5a3a10;color:#fff;text-align:center;padding:6px;font-size:13px;display:none}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes br{50%{transform:scale(1.015)}}@keyframes hp{50%{opacity:.25}}@keyframes rg{0%{transform:scale(.95);opacity:.85}100%{transform:scale(1.6);opacity:0}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}@keyframes mp{0%{box-shadow:0 0 0 0 var(--glow)}100%{box-shadow:0 0 0 24px transparent}}

.xl.two{table-layout:fixed}.two th{height:40px;line-height:1.2}.two th b{display:block;font-size:12px;color:var(--text)}.two th.today{color:var(--acc2)}.two th.hd b{color:var(--bad)}
.two td.tm{width:46px;font-size:11px}.two td.fc{height:34px;padding:0 6px;cursor:pointer}.two td.free2{color:var(--dim);font-size:11px;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(128,128,128,.05) 8px 16px)}
.two td.free2 span{opacity:.75}.two td.free2 b{float:left;color:var(--acc);font-size:16px;font-weight:400;line-height:1}.two td.free2.past{opacity:.4}.two td.off{background:rgba(226,125,125,.06)}
.two td.fillc{background:var(--tint);cursor:pointer;overflow:hidden;padding:3px 6px;border-right:3px solid var(--acc);vertical-align:top}.two td.fillc.st-completed{border-right-color:var(--ok);background:rgba(127,214,160,.14)}
.two td.fillc b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:12px;line-height:1.3;white-space:normal;overflow:hidden;overflow-wrap:anywhere;direction:ltr;text-align:right}.two td.fillc i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.two th.bh{font-size:10px;height:24px;padding:2px;font-weight:600}.m2 td.fc{padding:0 3px}.m2 td.free2 b{float:none;display:block;text-align:center}.m2 td.fillc{padding:3px 4px}.m2 td.fillc i{font-size:9.5px}

/* ===== GLASS v2 (matches the Gemini sketch) ===== */
html{background:#0a0a0a}html[data-theme=light]{background:#e8e4df}
html,body{background:transparent}
html[data-theme=dark]{--panel:rgba(66,48,34,.38);--raised:rgba(255,255,255,.09);--line:rgba(255,255,255,.16);--tint:rgba(var(--rgb),.24)}
html[data-theme=light]{--panel:rgba(255,255,255,.5);--raised:rgba(255,255,255,.55);--line:rgba(0,0,0,.1)}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
#bg i{position:absolute;inset:-24px;background-size:cover;background-position:center 25%;opacity:0;transition:opacity .7s}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.16),rgba(0,0,0,.4))}
html[data-theme=light] #bg::after{background:rgba(255,255,255,.45)}
body[data-bg="1"] #bg i:nth-child(1),body[data-bg="2"] #bg i:nth-child(2){opacity:1}
body{padding-top:env(safe-area-inset-top)}
.card,.ap,.xlw,.sum3>div,.seg,.cell,header,nav{-webkit-backdrop-filter:blur(28px) saturate(1.5);backdrop-filter:blur(28px) saturate(1.5)}
.card,.ap,.xlw,.sum3>div,.seg,.cell{box-shadow:0 8px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.14)}
.card{border-color:rgba(var(--rgb2),.42);border-radius:26px}
.modal>.card{background:rgba(24,18,14,.88)}
.in{background:rgba(0,0,0,.26)}
header{margin:10px 12px 4px;padding:12px 16px;border-radius:26px;background:var(--panel);border:1px solid rgba(var(--rgb2),.42);color:inherit;justify-content:center;position:relative}
header img{height:28px}header .row{position:absolute;left:14px;top:50%;transform:translateY(-50%)}#hdate{display:none}
html[data-theme=light] header img{filter:invert(1)}
nav{background:rgba(60,44,32,.4);border:1px solid rgba(var(--rgb2),.4)}
nav button.on{background:none;color:var(--acc2);box-shadow:none}
.m{background:rgba(255,255,255,.09)}
/* customers card */
#homeinfo{margin-bottom:12px}.qc{margin:0}
.qh{display:flex;justify-content:space-between;align-items:flex-end}.qh .t{font-size:30px;font-weight:700;line-height:1}
.qtabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:10px 0 2px}
.qtabs button{background:none;border:0;padding:4px 0 8px;color:var(--dim);font-size:13px}.qtabs button.on{color:var(--acc2);border-bottom:2px solid var(--acc2);margin-bottom:-1px;font-weight:700}
.qlist{max-height:186px;overflow:auto;position:relative;scrollbar-width:none}.qlist::-webkit-scrollbar{display:none}
.qr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.08);border-right:3px solid transparent}
.qr.on{background:rgba(var(--rgb),.3);border-radius:16px;border-right-color:var(--acc2);border-bottom-color:transparent}.qr.pv{opacity:.55}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;background:linear-gradient(145deg,var(--acc2),var(--accd));color:var(--onacc)}
.qr .grow{min-width:0;cursor:pointer}.qr b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.qr i{font-style:normal;font-size:11px;color:var(--dim)}
.mini{font-size:10.5px;direction:ltr;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;flex:none}
.qr.on .mini{background:var(--acc2);color:var(--onacc);border-color:transparent;font-weight:700}
.plus{width:34px;height:34px;border-radius:50%;border:0;background:rgba(var(--rgb),.3);color:var(--acc2);font-size:21px;line-height:1;flex:none}
.qf{margin-top:8px;font-size:11.5px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
/* assistant (compact) */
.acard{padding:14px;margin:0}
.ahead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ahead b{display:block;font-size:15px}
#sttl{font-size:13px;color:var(--acc2);margin-top:2px}#ssub{margin:3px 0 0;font-size:11.5px;color:var(--dim)}
.av2{position:static;width:auto;height:auto;display:inline-block}
.wave{position:static;transform:none;height:12px;margin-inline-start:6px;vertical-align:middle}
.av2.listening .wave,.av2.speaking .wave{display:inline-flex}
.acard .mic{width:56px;height:56px;flex:none;box-shadow:0 6px 18px rgba(176,129,88,.35)}.acard .mic svg{width:26px;height:26px}
#msgs{max-height:104px;margin:10px 0 0}#msgs:empty{display:none}
.sugs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}.sugs::-webkit-scrollbar{display:none}
.sug{flex:none;border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:99px;padding:6px 12px;font-size:12px}
.abar{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 8px;border-radius:99px;background:rgba(0,0,0,.28);border:1px solid var(--line);margin:0}
.abar .in{flex:1;min-width:0;border:0;background:transparent;padding:8px}
.abar .sidebtn{width:34px;height:34px;border:0;background:none;font-size:15px;flex:none}
.send{width:36px;height:36px;border-radius:50%;border:0;background:rgba(var(--rgb),.3);color:var(--acc2);font-size:18px;flex:none}
/* landscape: menu on the left, top to bottom */

html[data-theme=light] .in,html[data-theme=light] .abar{background:rgba(255,255,255,.75)}

/* logo */
header{background:rgba(14,9,5,.5)}header img{height:40px;filter:drop-shadow(0 0 10px rgba(var(--rgb2),.6))}
html[data-theme=light] header img{filter:invert(1)}html[data-theme=light] header{background:rgba(255,255,255,.78)}
/* brand + robot */
.brand{font-size:16px;display:block;letter-spacing:.3px;font-weight:800}
#stage.av2{position:relative;width:78px;height:78px;display:block;flex:none}
.rimg{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:2px solid rgba(var(--rgb2),.6);box-shadow:0 4px 16px rgba(0,0,0,.35);background:#b9a6dd;animation:rfloat 4.5s ease-in-out infinite;transform-origin:50% 90%}
.rimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border:0!important;border-radius:0!important;animation:none!important;box-shadow:none!important;z-index:1}
.rimg .eye{position:absolute;top:34.7%;width:15%;height:15%;border-radius:50%;background:#15101c;z-index:3;transform:scaleY(0);animation:blink 5s infinite}
.rimg .eye.l{left:26.5%}.rimg .eye.r{left:49.5%}
.rimg .mouth{position:absolute;left:39%;top:58.3%;width:13%;height:5.5%;background:#2a2431;border-radius:0 0 60% 60%/0 0 100% 100%;z-index:3;transform:scaleY(0);transform-origin:top}
#stage.listening .rimg{animation:rlisten 1.3s ease-in-out infinite;box-shadow:0 0 0 3px rgba(var(--rgb2),.55),0 0 22px var(--glow)}
#stage.processing .rimg{animation:rthink 1s ease-in-out infinite}#stage.processing .eye{animation:blink 1.2s infinite}
#stage.speaking .rimg{animation:rtalk .5s ease-in-out infinite}#stage.speaking .mouth{animation:talk .42s ease-in-out infinite alternate}
#stage.success .rimg{animation:rnod .6s ease-in-out 2}#stage.error .rimg{animation:rshake .4s ease-in-out 2}
@keyframes rfloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-3px) rotate(1.2deg)}}
@keyframes rlisten{0%,100%{transform:rotate(-5deg) scale(1.04)}50%{transform:rotate(5deg) scale(1.07)}}
@keyframes rthink{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes rtalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) scale(1.02)}}
@keyframes rnod{0%,100%{transform:translateY(0)}50%{transform:translateY(5px) rotate(3deg)}}
@keyframes rshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
@keyframes talk{0%{transform:scaleY(.15)}30%{transform:scaleY(1)}60%{transform:scaleY(.4)}100%{transform:scaleY(1.25)}}

/* ---------- customers: contacts import, files (پرونده), Persian<->Finglish name matching ---------- */
var PMAP={'ب':'b','پ':'p','ت':'t','ث':'s','ج':'j','چ':'C','ح':'h','خ':'x','د':'d','ذ':'z','ر':'r','ز':'z','ژ':'Z','س':'s','ش':'S','ص':'s','ض':'z','ط':'t','ظ':'z','غ':'G','ف':'f','ق':'G','ک':'k','گ':'g','ل':'l','م':'m','ن':'n','ه':'h','ة':'h'};

// consonant "skeleton": the same for «احمدی» and "Ahmadi" / "Ahmadi"; vowels are dropped (Finglish spells them inconsistently)
function skel(s){
 s=D(String(s)).toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u064B-\u065F\u0670\u0640]/g,'');
 s=s.replace(/kh/g,'x').replace(/sh/g,'S').replace(/ch/g,'C').replace(/gh/g,'G').replace(/zh/g,'Z').replace(/ph/g,'f').replace(/th/g,'t');
 var o='',last='';
 for(var i=0;i<s.length;i++){var ch=s.charAt(i),m=PMAP[ch];
  if(m===undefined){if(/[a-z]/.test(ch))m=LMAP[ch]||'';else if(/[A-Z]/.test(ch))m=ch;else m=''}
  if(m&&m!==last)o+=m;last=m}
 return o}
// a word that STARTS with a vowel (احمد/Ahmad, علی/Ali) is told apart from one that doesn't (حمید/Hamid)
var VOW_P='اآعئءؤأإ';
function skelw(w){var k=skel(w);if(!k)return k;var f=D(String(w)).toLowerCase().charAt(0);return (/[aeiou]/.test(f)||VOW_P.indexOf(f)>-1?'^':'')+k}
function lev(a,b){var p=[],i,j;for(j=0;j<=b.length;j++)p[j]=j;for(i=1;i<=a.length;i++){var prev=p[0];p[0]=i;for(j=1;j<=b.length;j++){var tmp=p[j];p[j]=Math.min(p[j]+1,p[j-1]+1,prev+(a.charAt(i-1)===b.charAt(j-1)?0:1));prev=tmp}}return p[b.length]}
var TITLE_RE=/^(آقای|اقای|آقا|اقا|خانم|جناب|دکتر|مهندس|استاد|حاج|حاجی|سید|سرکار|mr|mrs|ms|miss|dr|eng|agha|aghaye|aqa|aqaye|aghay|khanom|khanoom|haj|haji|seyed|sayed)$/i;
function stripTitles(s){return D(String(s)).replace(/[()\[\]{}_.,;:!؟?،\-–|\/\\"'0-9]/g,' ').split(/\s+/).filter(function(w){return w&&!TITLE_RE.test(w)}).join(' ')}
function nameTokens(s){return stripTitles(s).split(/\s+/).map(skelw).filter(Boolean)}

// each word of the query must match a DIFFERENT word of the customer's name (best pairs first)

 pairs.forEach(function(p){if(p[0]>=9||qi[p[1]]||cj[p[2]])return;qi[p[1]]=1;cj[p[2]]=1;tot+=p[0];n++});return n===qt.length?tot:-1}

/* ---- VCF (vCard) parsing: runs locally on the phone ---- */
function vUnesc(v){return v.replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1')}
function vQP(v){try{var bytes=[];v.replace(/=([0-9A-Fa-f]{2})|([^=])/g,function(m,h,c){bytes.push(h?parseInt(h,16):c.charCodeAt(0));return ''});return new TextDecoder('utf-8').decode(new Uint8Array(bytes))}catch(e){return v}}
function parseVCF(text){
 var raw=text.replace(/\r\n?/g,'\n').replace(/\n[ \t]/g,'').split('\n'),lines=[],cards=[],c=null;
 for(var q=0;q<raw.length;q++){var ln=raw[q];if(/QUOTED-PRINTABLE/i.test(ln)){while(/=$/.test(ln)&&q+1<raw.length)ln=ln.slice(0,-1)+raw[++q]}lines.push(ln)}
 lines.forEach(function(l){
  if(/^BEGIN:VCARD/i.test(l)){c={tel:[],fn:'',n:'',note:''};return}
  if(/^END:VCARD/i.test(l)){if(c)cards.push(c);c=null;return}
  if(!c)return;var i=l.indexOf(':');if(i<0)return;
  var key=l.slice(0,i).toUpperCase().replace(/^ITEM\d+\./,''),base=key.split(';')[0],val=l.slice(i+1);
  if(base==='LOGO')return;if(base==='PHOTO'){c.photo=val.indexOf('data:')===0?val:'data:image/'+(/PNG/i.test(key)?'png':'jpeg')+';base64,'+val.replace(/\s+/g,'');return}if(/QUOTED-PRINTABLE/.test(key))val=vQP(val);
  if(base==='FN')c.fn=vUnesc(val);else if(base==='N')c.n=val;else if(base==='TEL')c.tel.push(val);else if(base==='NOTE')c.note=vUnesc(val);else if(base==='BDAY')c.bday=val});
 return cards.map(function(k){var nm=k.fn;if(!nm&&k.n){var p=k.n.split(';');nm=((p[1]||'')+' '+(p[0]||'')).replace(/\\/g,'')}
  nm=String(nm||'').replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,' ').replace(/\s+/g,' ').trim();return {name:nm,tel:k.tel,note:k.note,photo:k.photo,bday:k.bday}})}

  try{res=await run(0)}catch(e){if(e&&e.conflict){res=await run(1)}else throw e}
  if(res==='wait'){if(manual)setMsg('اول پنجرهٔ باز را ببندید.',false)}
  else setMsg('همگام شد ✓ '+hm(),true)}
 catch(e){
  if(e&&(e.status===400||e.status===401)&&/refresh|token|JWT|Invalid/i.test(String(e.message))&&sess){sess=null;lsSet(SK,null);setMsg('نشست منقضی شد؛ دوباره وارد شوید.',false);try{render()}catch(x){}}
  else setMsg(nice(e),false)}
 finally{busy=false}}

async function login(){
 var em=($e('sbe')||{}).value,pw=($e('sbp')||{}).value;em=(em||'').trim();
 if(!em||!pw)return setMsg('ایمیل و رمز را بنویسید.',false);
 setMsg('در حال ورود…');
 try{
  var j=await http('/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY0,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});
  saveSess(j);meta={base:null,dirty:false};lsSet(MK,meta);
  await sync(true);try{render()}catch(x){}}
 catch(e){setMsg(nice(e),false)}}
function logout(){
 if(!confirm('از حساب خارج می‌شوید؟ اطلاعات روی همین گوشی می‌ماند.'))return;
 sess=null;meta={base:null,dirty:false};lsSet(SK,null);lsSet(MK,meta);st.msg='';render()}
function touch(){
 ver++;meta.dirty=true;lsSet(MK,meta);
 if(sess){clearTimeout(timer);timer=setTimeout(function(){sync(false)},2500)}}

function card(){
 var h='<div class="card"><h2>همگام‌سازی ابری</h2>';
 if(!sess)h+='<p class="dim">با ورود، اطلاعات روی ابر ذخیره می‌شود و در همهٔ دستگاه‌ها یکی است. اطلاعات فعلی همین دستگاه هم به ابر منتقل می‌شود. ایمیل و رمز همان کاربری است که در Supabase ساخته‌اید.</p><label>ایمیل</label><input class="in" id="sbe" type="email" dir="ltr" autocomplete="username" autocapitalize="off"><label>رمز</label><input class="in" id="sbp" type="password" dir="ltr" autocomplete="current-password"><button class="btn pri" data-a="sblogin" style="width:100%;margin-top:10px">ورود و همگام‌سازی</button>';
 else h+='<p class="dim">وارد شده با: <span dir="ltr">'+esc(sess.email||'')+'</span></p><div class="row"><button class="btn pri grow" data-a="sbsync">همگام‌سازی حالا</button><button class="btn dng" data-a="sblogout">خروج</button></div>';
 return h+'<div id="sbmsg" class="dim" style="margin-top:8px;color:'+(st.ok?'var(--ok)':'var(--bad)')+'">'+esc(st.msg||'')+'</div></div>'}

function init(){
 if(!sess)return;
 setTimeout(function(){sync(false)},800);
 document.addEventListener('visibilitychange',function(){if(!document.hidden)sync(false)});
 window.addEventListener('online',function(){sync(false)});
 setInterval(function(){if(!document.hidden)sync(false)},90000)}
async function pushReg(sub){var tk=await token(),j=sub.toJSON();await http('/rest/v1/push_subs?on_conflict=endpoint',{method:'POST',headers:Object.assign(hdr(tk),{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({user_id:sess.uid,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,ua:String(navigator.userAgent).slice(0,120)})})}
async function pushDel(ep){var tk=await token();await http('/rest/v1/push_subs?endpoint=eq.'+encodeURIComponent(ep),{method:'DELETE',headers:hdr(tk)})}
async function callFn(name,body){var tk=await token();return http('/functions/v1/'+name,{method:'POST',headers:{apikey:KEY0,Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify(body||{})})}
function logged(){return !!sess}
return {card:card,login:login,logout:logout,sync:sync,touch:touch,init:init,pushReg:pushReg,pushDel:pushDel,callFn:callFn,logged:logged}})();
MCSync.init();

})();
</script>
