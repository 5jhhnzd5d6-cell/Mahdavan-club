   catch(e){setAv('error');addMsg(/Gemini|اتصال|کلید/.test(e.message)?e.message:'ضبط صدا قابل پردازش نبود. دوباره امتحان کنید یا بنویسید.','er');setTimeout(function(){setAv('idle')},1800)}};

 else if(ar){voiceInfo.voice=ar;voiceInfo.lang=ar.lang;voiceInfo.note='صدای فارسی روی این گوشی نصب نیست؛ از صدای عربی استفاده می‌شود و تلفظ ممکن است دقیق نباشد.'}
